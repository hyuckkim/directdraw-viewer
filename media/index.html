<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DDS Viewer</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      text-align: center;
    }
    body {
      display: flex;
      margin: 0; padding: 0;
    }
    body .image {
      max-width: none;
      max-height: none;
	    margin: auto;
    }
    .header {
      text-align: left;
    }

    #main-image {
      display: block;
      overflow: hidden;
      
      padding: 0;
      background-size: 16px 16px;
      border: 1px solid var(--vscode-imagePreview-border);
    	background-image: conic-gradient(rgb(230, 230, 230) 25%, transparent 25% 50%, rgb(230, 230, 230) 50% 75%, transparent 75%);
    }
    .vscode-dark #main-image {
	    background-image: conic-gradient(rgb(20, 20, 20) 25%, transparent 25% 50%, rgb(20, 20, 20) 50% 75%, transparent 75%);
    }
    #main-image.full {
      width: auto;
      height: auto;
      max-width: none; 
      max-height: none;
    }
    button {
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      border: none;
    }
    .metadata {
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--vscode-editor-foreground);
    }
    .selector {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
      background: var(--vscode-panel-background);
      padding: 0.5rem;
      border: 1px solid var(--vscode-panel-border);
      border-radius: 6px;
    }
    .selector img {
      width: 40px;
      height: 40px;
      object-fit: cover;
      cursor: pointer;
      padding: 1px;
    }
    .selector img.active {
      padding: 0;
      border: 1px solid var(--vscode-panel-border);
    }
  </style>
</head>
<body class="container" data-vscode-context='{ "preventDefaultContextMenuItems": true }'>
  <div class="image">
    <div class="header">
      <span id="metadata" class="metadata"></span>
    </div>
    <img id="main-image" class="full" src="" alt="" />
  </div>

  <div class="selector" id="selector" style="display: none"></div>
  <div class="image-holder" style="display: none">
    <!-- IMAGES_PLACEHOLDER -->
  </div>

  <script>
    const vscode = acquireVsCodeApi();
    let idx = 0;
    enableImage();
    /*METADATA_PLACEHOLDER*/

    function setMetadata({ width, height, format }) {
      const metadataEl = document.getElementById('metadata');
      metadataEl.textContent = `${width} x ${height} | ${format}`;
    }

    function enableImage() {
      const allImages = document.querySelectorAll('.dds-image');

      const mainImage = document.getElementById('main-image');
      const selector = document.getElementById('selector');


      allImages.forEach((img, index) => {
        const thumb = document.createElement('img');
        thumb.src = img.src;
        thumb.dataset.index = index;
        thumb.addEventListener('click', () => {
          mainImage.src = img.src;
          document.querySelectorAll('.selector img').forEach(el => el.classList.remove('active'));
          thumb.classList.add('active');
          idx = index;
        });
        selector.appendChild(thumb);
      });

      if (allImages.length > 0) {
        mainImage.src = allImages[0].src;
        selector.querySelector('img').classList.add('active');
      }

      if (allImages.length === 1) {
        selector.style.display = 'none';
      } else {
        selector.style.display = 'flex';
      }
    }
    
    window.addEventListener('message', async (event) => {
    const message = event.data;

    if (message.type === 'copy') {
      await copyCurrentImage();
    }
  });

  async function copyCurrentImage(retries = 5) {
  if (!document.hasFocus() && retries > 0) {
    setTimeout(() => {
      copyCurrentImage(retries - 1);
    }, 20);
    return;
  }

  try {
    const mainImage = document.getElementById('main-image');

    if (!mainImage?.src) {
      throw new Error('No image to copy');
    }

    await navigator.clipboard.write([
      new ClipboardItem({
        'image/png': fetch(mainImage.src).then(response => response.blob())
      })
    ]);
  } catch (e) {
    console.error('Failed to copy image:', e);
  }
}

  document.querySelector('button.download').addEventListener('click', () => {
    vscode.postMessage({ type: "download", index: idx })
  });
  </script>
</body>
</html>
